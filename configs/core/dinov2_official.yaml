# @package _global_
# The official DINOv2 recipe (facebookresearch/dinov2 ssl_default_config.yaml, which vitl16_short.yaml runs) on grayscale
# images. Run configs list it in their defaults right before _self_ and override what they change. Known differences:
# the crops keep the image's aspect ratio instead of drawing it from 3/4-4/3, the input has 1 channel instead of RGB,
# and the ViT is MONAI's (no CLS position embedding, LayerNorm eps 1e-5).

transforms:
  cpu_tr_transforms: dinov2
  cpu_val_transforms: dinov2
  gpu_tr_transforms: none
  gpu_val_transforms: none
  _cpu_tr_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}
    global_view_scale: [0.32, 1.0]
    local_view_scale: [0.05, 0.32]
    num_local_views: 8
    resize_mode: bicubic
    # Horizontal flip
    flip_axis: 1
    affine_prob: 0.0
    histogram_shift_prob: 0.0
    # ColorJitter(brightness=0.4, contrast=0.4, saturation=0.2, hue=0.1) with p=0.8; saturation, hue and
    # RandomGrayscale do nothing to grayscale images
    color_jitter_prob: 0.8
    brightness: 0.4
    contrast: 0.4
    # Official GaussianBlur(p) blurs with probability 1 - p, so its p = 1.0, 0.1 and 0.5 blur 0%, 90% and 50% of the views
    blur_probs: [0.0, 0.9, 0.5]
    blur_sigma: [0.1, 2.0]
    solarize_prob: 0.2
    solarize_threshold: ${eval:"128 / 255"}
    # 8-bit PNGs, which ToTensor scales to [0, 1]
    value_range: [0, 255]
    # ImageNet mean and std, averaged over the RGB channels
    normalize_mean: 0.449
    normalize_std: 0.226
  _cpu_val_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}

model:
  dimensions: 2D
  # For a total batch size of 1024, scaled by sqrt(total batch size / 1024)
  pretrain_lr: 0.004
  hidden_size: 1024
  ibot_separate_head: False
  projection_dim: 65536
  # ViT-L/16
  _pretrain_net:
    num_layers: 24
    num_heads: 16
    mlp_dim: 4096
    qkv_bias: True
    layer_scale_init: 1e-5
    drop_path_rate: 0.3
    num_register_tokens: 0

training:
  min_lr: 1e-6
  patch_size: [16, 16]
  global_crop_size: [224, 224]
  local_crop_size: [96, 96]
  # Per GPU, as official. Official runs 4 nodes of 8 GPUs (2048 in total); set hardware.num_nodes=4 to match
  batch_size: 64
  epochs: 100
  # The official epoch length is 1250 iterations
  train_batches_per_epoch_per_device: 1250
  # DINOv2Module has no validation step
  val_batches_per_epoch_per_device: 0
  # 10 and 30 of the official 100 epochs
  warmup_epochs: ${eval:"${training.epochs} // 10"}
  teacher_temp_warmup_epochs: ${eval:"${training.epochs} * 3 // 10"}
  gradient_clip_val: 3.0

lightning:
  lightning_module: DINOv2Module
  _data_module:
    # The official sampler shuffles without replacement
    sample_with_replacement: False
    collate_fn:
      _target_: asparagus.modules.transforms.blockmask.DINOv2Collate
      global_view_size: ${training.global_crop_size}
      patch_size: ${training.patch_size}
      mask_probability: 0.5
      mask_ratio_min: 0.1
      mask_ratio_max: 0.5
  _lightning_module:
    min_lr: ${training.min_lr}
    weight_decay: 0.04
    weight_decay_end: 0.4
    layer_decay: 0.9
    gradient_clip_val: ${training.gradient_clip_val}
    teacher_temp_warmup_epochs: ${training.teacher_temp_warmup_epochs}
    teacher_temp_min: 0.04
    teacher_temp_max: 0.07
    ibot_loss_weight: 1.0
    koleo_loss_weight: 0.1
    freeze_last_layer_epochs: 1

logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: False
  mlflow_logging: False
  log_every_n_steps: 100
  log_images_every_n_epoch: 1
