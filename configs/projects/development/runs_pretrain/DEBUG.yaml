# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/cpu@hardware
  - /model/unet_tiny@model
  - _self_

task: PT000_LauritSSL2D
root: base
stem: debug

model:
  dimensions: 2D

training:
  accumulate_grad_batches: 4
  patch_size: [32, 32]
  batch_size: 2
  epochs: 5
  warmup_epochs: 3

data:
  train_split: split_40_10_50
logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: True
  mlflow_logging: False
  log_every_n_steps: 1
  log_images_every_n_epoch: 1