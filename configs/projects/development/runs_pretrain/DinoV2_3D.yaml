# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/cpu@hardware
  - /model/dinov2_test@model
  - /core/dinov2@
  - _self_

task: PT001_ClevelandCCF
root: base
stem: debug

hardware:
  num_workers: 4

model:
  dimensions: 3D
  hidden_size: 192

data:
  train_split: split_40_10_50

training:
  patch_size: [16, 16, 16]
  global_crop_size: [64, 64, 64]
  local_crop_size: [32, 32, 32]
  batch_size: 2
  epochs: 5
  train_batches_per_epoch_per_device: 50

logger:
  log_every_n_steps: 1
