# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/1gpu40cpu@hardware
  - /model/dinov2_test@model
  - /core/dinov2@
  - _self_

task: PT000_LauritSSL_PNG
root: base
stem: debug

model:
  dimensions: 2D
  hidden_size: 192
  projection_dim: 420

data:
  train_split: split_80_10_10

training:
  patch_size: [16, 16]
  global_crop_size: [64, 64]
  local_crop_size: [32, 32]
  batch_size: 128
  epochs: 100
  train_batches_per_epoch_per_device: 10000

logger:
  log_every_n_steps: 1
