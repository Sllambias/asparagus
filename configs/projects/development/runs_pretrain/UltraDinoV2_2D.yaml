# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/2gpus@hardware
  - /model/dinov2_test@model
  - /core/dinov2@
  - _self_

task: PT400_DeepFetalV1
root: base
stem: debug

model:
  dimensions: 2D
  hidden_size: 768

data:
  train_split: split_manual

training:
  patch_size: [16, 16]
  global_crop_size: [224, 224]
  local_crop_size: [96, 96]
  batch_size: 256
  epochs: 100
  train_batches_per_epoch_per_device: 10000

logger:
  log_every_n_steps: 1
