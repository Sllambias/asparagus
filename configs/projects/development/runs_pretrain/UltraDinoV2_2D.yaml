# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/2gpus@hardware
  - /model/dinov2_test@model
  - _self_

task: PT400_DeepFetalV1
root: base
stem: debug

transforms:
  cpu_tr_transforms: dinov2
  cpu_val_transforms: dinov2
  gpu_tr_transforms: none
  gpu_val_transforms: none
  _cpu_tr_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}
  _cpu_val_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}

model:
  dimensions: 2D
  hidden_size: 768
  ibot_separate_head: False
  projection_dim: 65536

data:
  train_split: split_manual
  
training:
  min_lr: 1e-6
  patch_size: [16,16]
  global_crop_size: [224,224]
  local_crop_size: [96,96]
  batch_size: 256
  epochs: 100
  train_batches_per_epoch_per_device: 10000
  val_batches_per_epoch_per_device: 0
  warmup_epochs: ${eval:"${training.epochs} // 10"}
  teacher_temp_warmup_epochs: ${eval:"${training.epochs} * 3 // 10"}
  gradient_clip_val: 3.0

lightning:
  lightning_module: DINOv2Module
  _data_module:
    collate_fn:
      _target_: asparagus.modules.transforms.blockmask.DINOv2Collate
      global_view_size: ${training.global_crop_size}
      patch_size: ${training.patch_size}
  _lightning_module:
    teacher_temp_warmup_epochs: ${training.teacher_temp_warmup_epochs}
    gradient_clip_val: ${training.gradient_clip_val}
    min_lr: ${training.min_lr}

logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: False
  mlflow_logging: False
  log_every_n_steps: 1
  log_images_every_n_epoch: 1